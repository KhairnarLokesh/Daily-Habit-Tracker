<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/themes.js"></script>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-top">
                <div class="theme-controls">
                    <div class="preset-selector">
                        <button class="theme-preset-btn" data-theme="ocean" title="Ocean Theme"></button>
                        <button class="theme-preset-btn" data-theme="forest" title="Forest Theme"></button>
                        <button class="theme-preset-btn" data-theme="sunset" title="Sunset Theme"></button>
                    </div>
                    <div class="theme-toggle-wrapper">
                        <label class="switch">
                            <input type="checkbox" id="themeModeToggle">
                            <span class="slider">
                                <i class="fas fa-sun slider-icon"></i>
                                <i class="fas fa-moon slider-icon"></i>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="header-content">
                <h1>Daily Habit Tracker</h1>
                <p>Stay consistent, build streaks, achieve your goals.</p>
                <!-- Gamification UI -->
                <div class="user-stats-container">
                    <div class="level-badge">
                        <i class="fas fa-star"></i>
                        <span id="userLevelDisplay">Level 1</span>
                    </div>
                    <div class="xp-bar-container">
                        <div class="xp-info">
                            <span>XP Progress</span>
                            <span id="userXpDisplay">0 / 100</span>
                        </div>
                        <div class="xp-track">
                            <div class="xp-fill" id="xpFillBar"></div>
                        </div>
                    </div>
                </div>

                <button id="syncBtn" class="btn-secondary" style="margin-top: 10px;">
                    <i class="fas fa-link"></i> Sync Devices
                </button>
            </div>
        </header>

        <main class="main-content">
            <section class="add-habit-section">
                <form id="addHabitForm" class="add-habit-form">
                    <div class="input-group">
                        <input type="text" id="habitNameInput" placeholder="What habit do you want to build?" required
                            autocomplete="off">
                        <select id="habitCategoryInput" class="category-select">
                            <option value="health">🏃‍♂️ Health</option>
                            <option value="work">💻 Work</option>
                            <option value="personal">🧘‍♂️ Personal</option>
                            <option value="hobby">🎨 Hobby</option>
                        </select>
                        <button type="submit" class="btn-primary" id="addBtn">
                            <i class="fas fa-plus"></i> Add Habit
                        </button>
                    </div>
                </form>
            </section>

            <section class="habits-section">
                <div class="section-header">
                    <h2>Your Habits</h2>
                    <span id="dateDisplay" class="date-display"></span>
                </div>

                <div class="filter-container">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="health">Health</button>
                    <button class="filter-btn" data-filter="work">Work</button>
                    <button class="filter-btn" data-filter="personal">Personal</button>
                    <button class="filter-btn" data-filter="hobby">Hobby</button>
                </div>

                <div id="habitsList" class="habits-grid">
                    <!-- Habit cards will be injected here by JS -->
                </div>

                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-icon"><i class="fas fa-seedling"></i></div>
                    <h3>No habits yet</h3>
                    <p>Add your first habit above to start tracking!</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Sync Modal Container -->
    <div id="syncModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Sync Your Devices</h3>
            <p>Copy this link and open it on another device to sync your habits automatically!</p>
            <div class="input-group" style="margin-top: 15px;">
                <input type="text" id="syncLinkInput" readonly>
                <button id="copyLinkBtn" class="btn-primary">Copy</button>
            </div>
            <button id="closeModalBtn" class="btn-secondary" style="margin-top: 15px; width: 100%;">Close</button>
        </div>
    </div>

    <script src="/script.js"></script>
</body>

</html>
